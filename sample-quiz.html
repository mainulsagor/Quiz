<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Quiz</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:760px;margin:32px auto;padding:20px}
.panel{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:24px}
a{color:#2563eb}.question{padding:16px 0;border-bottom:1px solid #e2e8f0}label{display:block;margin:10px 0}
button{background:#2563eb;color:white;border:0;border-radius:9px;padding:12px 18px;cursor:pointer;font-weight:bold}
#result{font-weight:bold;margin-top:18px}
</style></head>
<body><main class="wrap"><p><a href="../index.html">← Back to QuizHub</a></p>
<section class="panel"><h1>Sample English Quiz</h1><p>This is a demo file. Replace it with your own quiz HTML file.</p>
<form id="quiz">
<div class="question"><strong>1. Choose the synonym of “famous”.</strong>
<label><input type="radio" name="q1" value="a"> Notorious</label>
<label><input type="radio" name="q1" value="b"> Renowned</label>
<label><input type="radio" name="q1" value="c"> Ordinary</label></div>
<div class="question"><strong>2. Which word means “beginning”?</strong>
<label><input type="radio" name="q2" value="a"> Early</label>
<label><input type="radio" name="q2" value="b"> Late</label>
<label><input type="radio" name="q2" value="c"> Final</label></div>
<p><button type="submit">Submit answers</button></p><div id="result" aria-live="polite"></div></form>
</section></main>
<script>
document.getElementById('quiz').addEventListener('submit', function(e){
 e.preventDefault(); const answers={q1:'b',q2:'a'}; let score=0;
 for(const [q,a] of Object.entries(answers)){if(new FormData(this).get(q)===a)score++;}
 document.getElementById('result').textContent=`Your score: ${score} / ${Object.keys(answers).length}`;
});
</script></body></html>
