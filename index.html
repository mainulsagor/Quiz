
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eudaimonia | Learn Through Stories & Quizzes</title>

  <meta name="description" content="Learn vocabulary through stories and practice with 100 days of quizzes.">

  <!-- Existing CSS file -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Home page only */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101a35, #244b73);
      color: #ffffff;
    }

    .home-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
      box-sizing: border-box;
    }

    .home-container h1 {
      font-size: clamp(38px, 7vw, 64px);
      margin: 0 0 15px;
      letter-spacing: 1px;
    }

    .home-description {
      max-width: 650px;
      margin: 0 auto 35px;
      color: #dce8f5;
      font-size: 18px;
      line-height: 1.8;
    }

    .home-buttons {
      display: flex;
      justify-content: center;
      align-items: stretch;
      flex-wrap: wrap;
      gap: 18px;
      width: 100%;
      max-width: 550px;
    }

    .home-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      flex: 1 1 220px;
      min-height: 60px;
      padding: 12px 20px;
      box-sizing: border-box;
      border: 2px solid #ffffff;
      border-radius: 12px;
      background: #ffffff;
      color: #14213d;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      transition: background 0.2s, color 0.2s,
                  transform 0.2s;
    }

    .home-button:hover {
      background: #dbeafe;
      color: #10264a;
      transform: translateY(-3px);
    }

    .home-button:focus-visible {
      outline: 3px solid #facc15;
      outline-offset: 4px;
    }

    .home-footer {
      margin-top: 55px;
      color: #c6d4e5;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .home-container {
        padding: 20px;
      }

      .home-description {
        font-size: 16px;
      }

      .home-buttons {
        flex-direction: column;
      }

      .home-button {
        width: 100%;
        flex-basis: auto;
      }
    }
  </style>
</head>

<body>

  <main class="home-container">

    <h1>Eudaimonia</h1>

    <p class="home-description">
      Discover the power of ancient knowledge.
      Improve your vocabulary through memorable stories
      and challenge yourself with 100 days of quizzes.
    </p>

    <div class="home-buttons">

      <!-- Button 1: Separate Stories page -->
      <a class="home-button" href="stories.html">
        📖 Read Stories
      </a>

      <!-- Button 2: Separate Day 1–100 page -->
      <a class="home-button" href="days.html">
        📝 Day 1–100 Quiz
      </a>

    </div>

    <footer class="home-footer">
      Learn • Remember • Improve
    </footer>

  </main>

  <!-- Existing JavaScript file -->
  <script src="js/script.js" defer></script>

</body>
</html>
