
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Quiz Hub | Choose an Exam</title>
  <meta name="description" content="Choose a quiz and start your exam.">

  <style>
    :root {
      --navy: #14213d;
      --blue: #2563eb;
      --bg: #f4f7fb;
      --muted: #64748b;
      --line: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: var(--bg);
    }

    .topbar {
      background: var(--navy);
      color: white;
      padding: 18px 22px;
    }

    .topbar-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .brand span {
      color: #93c5fd;
    }

    .tag {
      font-size: 12px;
      background: #24365d;
      padding: 7px 10px;
      border-radius: 999px;
    }

    main {
      max-width: 1100px;
      margin: 34px auto;
      padding: 0 18px 40px;
    }

    .hero {
      background: white;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 28px #14213d0a;
    }

    .eyebrow {
      color: var(--blue);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 11px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 40px);
      margin: 10px 0;
      color: var(--navy);
    }

    .intro {
      color: var(--muted);
      line-height: 1.6;
      max-width: 650px;
      margin: 0;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin: 24px 0 18px;
      flex-wrap: wrap;
    }

    input,
    select {
      font: inherit;
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 10px;
      padding: 12px 14px;
    }

    input {
      flex: 1;
      min-width: 220px;
    }

    select {
      max-width: 100%;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 220px;
      box-shadow: 0 5px 18px #14213d08;
    }

    .icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #eff6ff;
      font-size: 22px;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 18px;
      margin: 0 0 8px;
      color: var(--navy);
    }

    .card p {
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
      margin: 0 0 18px;
      flex: 1;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      text-decoration: none;
      color: white;
      background: var(--blue);
      padding: 11px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      transition: background .2s;
      font-family: inherit;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .set-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .set-links .btn {
      flex: 1 1 90px;
    }

    .hidden-set {
      display: none;
    }

    .more-btn {
      width: 100%;
      margin-top: 12px;
      background: #e2e8f0;
      color: var(--navy);
    }

    .more-btn:hover {
      background: #cbd5e1;
      color: var(--navy);
    }

    .card > .btn {
      margin-top: auto;
    }

    .empty {
      background: white;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      padding: 28px;
      color: var(--muted);
      grid-column: 1 / -1;
    }

    footer {
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      padding: 22px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 540px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 22px;
      }

      .topbar-inner {
        align-items: flex-start;
        flex-direction: column;
      }

      input {
        min-width: 100%;
      }

      .toolbar select {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Quiz<span>Hub</span></div>
      <div class="tag">ONLINE PRACTICE EXAMS</div>
    </div>
  </header>

  <main>

    <section class="hero">
      <div class="eyebrow">Your practice space</div>

      <h1>Choose a quiz to begin</h1>

      <p class="intro">
        Select a subject below to open its exam.
        Search by quiz title, subject, or day.
      </p>
    </section>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search quizzes or days..."
        aria-label="Search quizzes"
      >

      <select id="category" aria-label="Filter by category">
        <option value="all">All subjects</option>
      </select>
    </div>

    <p class="count" id="count" aria-live="polite"></p>

    <section class="grid" id="quizGrid"></section>

  </main>

  <footer>
    QuizHub &middot; Add or remove quiz entries in index.html.
  </footer>

  <script>
    // ========================================
    // QUIZ LIST
    // ========================================

    const QUIZZES = [
      {
        title: "GRE Vocabulary",
        category: "Vocabulary",
        description: "Practice GRE vocabulary MCQs from Day 1 to Day 100.",
        icon: "📘",

        // Automatically generate DAY 1 to DAY 100.
        sets: Array.from({ length: 100 }, (_, i) => ({
          title: `DAY ${i + 1}`,
          file: `${i + 1} pdf.htm`
        }))
      },

      {
        title: "333 Barrons",
        category: "English",
        description: "Practice English questions.",
        icon: "✍️",
        file: "barrons.html",
        details: "Grammar test"
      },

      {
        title: "Word Smart Practice",
        category: "Model Test",
        description: "Practice Word Smart MCQs.",
        icon: "📝",
        file: "wordsmart.html",
        details: "Practice exam"
      }
    ];

    // ========================================
    // HTML ELEMENTS
    // ========================================

    const grid = document.getElementById("quizGrid");
    const search = document.getElementById("search");
    const category = document.getElementById("category");
    const count = document.getElementById("count");

    // ========================================
    // CATEGORY DROPDOWN
    // ========================================

    const categories = [
      ...new Set(QUIZZES.map(quiz => quiz.category))
    ].sort();

    categories.forEach(name => {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      category.appendChild(option);
    });

    // ========================================
    // RENDER QUIZZES
    // ========================================

    function renderQuizzes() {
      const term = search.value.trim().toLowerCase();
      const selectedCategory = category.value;

      const filteredQuizzes = QUIZZES.filter(quiz => {
        const matchesCategory =
          selectedCategory === "all" ||
          quiz.category === selectedCategory;

        const searchableText = [
          quiz.title,
          quiz.category,
          quiz.description,
          ...(quiz.sets || []).map(set => set.title)
        ].join(" ").toLowerCase();

        return matchesCategory && searchableText.includes(term);
      });

      count.textContent =
        `${filteredQuizzes.length} ${
          filteredQuizzes.length === 1 ? "quiz" : "quizzes"
        } available`;

      grid.replaceChildren();

      if (filteredQuizzes.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent =
          "No quizzes match your search. Try another title or subject.";
        grid.appendChild(empty);
        return;
      }

      filteredQuizzes.forEach(quiz => {
        const card = document.createElement("article");
        card.className = "card";

        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = quiz.icon || "📝";

        const heading = document.createElement("h2");
        heading.textContent = quiz.title;

        const description = document.createElement("p");
        description.textContent = quiz.description || "";

        card.append(icon, heading, description);

        // ========================================
        // MULTIPLE SETS + MORE DAYS BUTTON
        // ========================================

        if (Array.isArray(quiz.sets) && quiz.sets.length > 0) {
          const setLinks = document.createElement("div");
          setLinks.className = "set-links";

          const INITIAL_DAYS = 6;

          quiz.sets.forEach((set, index) => {
            const link = document.createElement("a");

            link.className = "btn";
            link.href = set.file;
            link.textContent = set.title;

            if (index >= INITIAL_DAYS) {
              link.classList.add("hidden-set");
            }

            setLinks.appendChild(link);
          });

          card.appendChild(setLinks);

          if (quiz.sets.length > INITIAL_DAYS) {
            const moreBtn = document.createElement("button");

            moreBtn.className = "btn more-btn";
            moreBtn.type = "button";
            moreBtn.textContent = "More Days ▼";
            moreBtn.setAttribute("aria-expanded", "false");

            let expanded = false;

            moreBtn.addEventListener("click", () => {
              expanded = !expanded;

              setLinks.querySelectorAll(".hidden-set").forEach(link => {
                link.style.display = expanded ? "inline-flex" : "none";
              });

              moreBtn.textContent = expanded
                ? "Show Less ▲"
                : "More Days ▼";

              moreBtn.setAttribute(
                "aria-expanded",
                String(expanded)
              );
            });

            card.appendChild(moreBtn);
          }

        } else if (quiz.file) {
          // Single quiz button.
          const link = document.createElement("a");

          link.className = "btn";
          link.href = quiz.file;
          link.textContent = "Start Quiz";

          card.appendChild(link);
        }

        grid.appendChild(card);
      });
    }

    // ========================================
    // SEARCH AND CATEGORY FILTER
    // ========================================

    search.addEventListener("input", renderQuizzes);
    category.addEventListener("change", renderQuizzes);

    // ========================================
    // INITIAL PAGE LOAD
    // ========================================

    renderQuizzes();
  </script>

</body>
</html>
