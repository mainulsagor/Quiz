
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eudaimonia | Stories, Vocabulary & Quizzes</title>

  <meta name="description" content="Learn vocabulary through stories, 100 days of quizzes, 333 Barron's and Word Smart practice.">

  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101a35, #244b73);
      color: #ffffff;
    }

    .home-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    .home-container h1 {
      font-size: clamp(38px, 7vw, 64px);
      margin: 0 0 15px;
      letter-spacing: 1px;
    }

    .home-description {
      max-width: 680px;
      margin: 0 auto 35px;
      color: #dce8f5;
      font-size: 18px;
      line-height: 1.8;
    }

    .home-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 650px;
    }

    .home-button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 75px;
      padding: 18px 15px;
      box-sizing: border-box;
      border: 2px solid #ffffff;
      border-radius: 14px;
      background: #ffffff;
      color: #14213d;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s, background 0.2s;
    }

    .home-button:hover {
      background: #dbeafe;
      transform: translateY(-4px);
    }

    .home-button:focus-visible {
      outline: 3px solid #facc15;
      outline-offset: 4px;
    }

    .home-footer {
      margin-top: 45px;
      color: #c6d4e5;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .home-buttons {
        grid-template-columns: 1fr;
        max-width: 360px;
        gap: 14px;
      }

      .home-description {
        font-size: 16px;
      }

      .home-button {
        min-height: 62px;
      }
    }
  </style>
</head>

<body>

  <main class="home-container">

    <h1>Eudaimonia</h1>

    <p class="home-description">
      Discover ancient knowledge, learn vocabulary through
      memorable stories, and improve your English with
      structured quizzes and practice tests.
    </p>

    <div class="home-buttons">

      <a class="home-button" href="stories.html">
        📖 Read Stories
      </a>

      <a class="home-button" href="days.html">
        📝 Day 1–100 Quiz
      </a>

      <a class="home-button" href="barrons.html">
        📚 333 Barron's
      </a>

      <a class="home-button" href="wordsmart.html">
        ✍️ Word Smart
      </a>

    </div>

    <footer class="home-footer">
      Learn • Remember • Improve
    </footer>

  </main>

  <script src="js/script.js" defer></script>

</body>
</html>
