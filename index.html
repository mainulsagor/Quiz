
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Eudaimonia | Stories, Vocabulary & Quizzes</title>

  <meta name="description" content="Learn vocabulary through stories, 100 days of quizzes, 333 Barron's and Word Smart practice.">
  <link rel="stylesheet" href="css/style.css">

<style>
  body {
    margin: 0;
    background-color: #14213d;
  }

  body::before {
    transition: background-position 0.1s linear;
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url("images/eudaimonia-bg.jpg");
    background-size: cover;
   background-position: var(--parallax-position, center);
    background-repeat: no-repeat;
    z-index: -1;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(10, 20, 40, 0.35);
    z-index: -1;
    pointer-events: none;
  }
  html {
  scroll-behavior: smooth;
}

body::before {
  background-attachment: scroll;
  will-change: background-position;
}
</style>



</head>

<body>

  <main class="home-container">

    <h1>Eudaimonia</h1>

    <p class="home-description">
      Discover ancient knowledge, learn vocabulary through
      memorable stories, and improve your English with
      structured quizzes and practice tests.
    </p>

    <div class="home-buttons">

      <a class="home-button" href="stories.html">
        📖 Read Stories
      </a>

      <a class="home-button" href="days.html">
        📝 Day 1–100 Quiz
      </a>

      <a class="home-button" href="barrons.html">
        📚 333 Barron's
      </a>

      <a class="home-button" href="wordsmart.html">
        ✍️ Word Smart
      </a>

    </div>

    <footer class="home-footer">
      Learn • Remember • Improve
    </footer>

  </main>

  <script src="js/script.js" defer></script>


<script>
  const parallaxBg = document.body;

  window.addEventListener("scroll", function () {
    const offset = window.scrollY * 0.3;

    parallaxBg.style.setProperty(
      "--parallax-position",
      `center calc(50% + ${offset}px)`
    );

    document.body.style.setProperty(
      "--parallax-position",
      `center calc(50% + ${offset}px)`
    );

    document.querySelector("body").style.backgroundPosition =
      `center ${offset}px`;
  }, { passive: true });
</script>
<script>
  window.addEventListener("scroll", function () {
    const offset = window.scrollY * 0.3;

    document.body.style.setProperty(
      "--parallax-position",
      `center calc(50% + ${offset}px)`
    );
  }, { passive: true });
</script>

</body>
</html>
