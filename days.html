<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>100 Days Vocabulary Quiz</title>

  <meta name="description"
        content="Practice vocabulary with 100 days of online quizzes.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #14213d;
    }

    header {
      background: #14213d;
      color: white;
      text-align: center;
      padding: 30px 15px;
      border-radius: 15px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    header p {
      margin: 0;
      line-height: 1.6;
    }

    .home {
      display: inline-block;
      margin-top: 18px;
      padding: 11px 20px;
      background: #fca311;
      color: #14213d;
      text-decoration: none;
      font-weight: bold;
      border-radius: 7px;
    }

    .section-title {
      text-align: center;
      margin: 30px 0 10px;
    }

    .description {
      text-align: center;
      color: #475569;
      line-height: 1.6;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(115px, 1fr)
      );
      gap: 14px;
      max-width: 1100px;
      margin: 25px auto;
    }

    .day-button {
      display: flex;
      min-height: 85px;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 7px;
      background: white;
      color: #14213d;
      border: 2px solid #dbeafe;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
      transition: 0.2s;
    }

    .day-button:hover {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
      transform: translateY(-3px);
    }

    .day-number {
      font-size: 20px;
    }

    .day-label {
      font-size: 13px;
    }

    footer {
      text-align: center;
      margin-top: 35px;
      padding: 20px;
      color: #64748b;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      header h1 {
        font-size: 24px;
      }

      .days {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>100 Days Vocabulary Quiz</h1>

    <p>
      Improve your vocabulary one day at a time.
      Choose a day and start practising!
    </p>

    <a class="home" href="index.html">
      ← Back to Home
    </a>
  </header>

  <main>
    <h2 class="section-title">Choose Your Quiz Day</h2>

    <p class="description">
      Select any day from 1 to 100 to open its vocabulary quiz.
    </p>

    <div class="days" id="days-container"></div>
  </main>

  <footer>
    <p>100 Days Vocabulary Challenge</p>
    <p>Learn • Practise • Improve</p>
  </footer>

  <script>
    const container = document.getElementById("days-container");

    for (let day = 1; day <= 100; day++) {
      const link = document.createElement("a");

      link.className = "day-button";
      link.href = "quizzes/day" + day + ".htm";

      link.innerHTML = `
        <span class="day-number">📘 DAY ${day}</span>
        <span class="day-label">Start Quiz →</span>
      `;

      container.appendChild(link);
    }
  </script>

</body>
</html>
```
